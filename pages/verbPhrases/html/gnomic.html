<blockquote>
  <p>
    The Gnomic is the same as the Episodic, just
    with the first consonant and vowel reduplicated.<br>
    Example: <italic>χall</italic> “to bite” has the gnomic form <italic>χaχall</italic>.
  </p>
  <p>
    Another common construction of the gnomic is to lengthen the first vowel.<br>
    Example: <italic>oq</italic> “to fly” has the gnomic form <italic>ōq</italic>.
  </p>
</blockquote>
